[project]
name = "intelligent-document-agent"
version = "0.1.0"
description = "AxysAI para Consulta de Documentos (RAG)"
requires-python = ">=3.10,<3.14"
readme = "README.md"

dependencies = [
    # --- Web / API ---
    "fastapi>=0.124,<0.125",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12,<0.1",

    # --- Interface ---
    "streamlit>=1.40,<2.0",

    # --- Persistência ---
    "sqlmodel>=0.0.22,<0.1",
    "alembic>=1.14,<2.0",

    # --- Orquestração / LLM ---
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langgraph>=1.2,<2.0",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "langchain-ollama>=0.2,<1.0",
    "langchain-google-genai>=2.0,<3.0",

    # --- Embeddings / reranking / busca ---
    "sentence-transformers>=3.2,<4.0",
    "rank-bm25>=0.2.2,<0.3",
    "chromadb>=1.0,<2.0",

    # --- Extração de documentos ---
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=1.0,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "pandas>=2.2,<3.0",
    "lxml>=5.3,<6.0",

    # --- Gráficos (ferramenta de organizar planilha no chat) ---
    "matplotlib>=3.9,<4.0",

    # --- OCR (opcional em tempo de execução) ---
    "pytesseract>=0.3.13,<0.4",
    "pdf2image>=1.17,<2.0",

    # --- Segurança (validação de upload) ---
    "filetype>=1.2,<2.0",

    # --- Utilitários ---
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.4,<25.0",
    "httpx>=0.27,<0.28",
    "requests>=2.31,<3.0",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.7,<0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
